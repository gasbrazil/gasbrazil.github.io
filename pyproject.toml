[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gasbrazil"
version = "0.1.0"
description = "Data tools and canonical lake for Brazil's natural gas and power market"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0,<3.1",
    "pyarrow>=16.0.0,<26",
    "boto3>=1.34.0,<2",
    "requests>=2.31.0,<3",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.30.0,<1",
    "pydantic>=2.0.0",
]
pipeline = [
    "openpyxl>=3.1.0,<3.2",
    "markdown>=3.6.0,<4",
]
test = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
dev = [
    "gasbrazil[api,pipeline,test]",
    "ruff>=0.5.0",
]

[tool.ruff]

line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (FastAPI Query/Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["shared", "api", "flows", "ons", "poc", "pld", "contratos", "supply", "precos", "mago", "desk"]
