<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GasBrazil.com</title>
<style>
:root {
  --bg: #f7f8fa; --panel: #ffffff; --border: #e2e5ea; --text: #1a1d23; --muted: #6b7280;
  --accent: #1d6f5c; --accent-soft: #e6f2ef;
  --shadow: 0 1px 2px rgba(16,24,40,.04);
  --shadow-lg: 0 8px 24px rgba(16,24,40,.08);
  --font: "Degular", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
[data-theme="dark"] {
  --bg: #14161a; --panel: #1c1f24; --border: #2b2f36; --text: #ecedee; --muted: #9aa1ac;
  --accent: #4fbf9f; --accent-soft: #1c2e29;
  --shadow: 0 1px 2px rgba(0,0,0,.2);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
  display: flex; flex-direction: column; min-height: 100vh;
}
#theme-toggle {
  position: fixed; top: 20px; right: 20px; background: none; border: 1px solid var(--border);
  border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 15px; color: var(--text);
}
main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; text-align: center; }
.wordmark { font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
.wordmark .dot { color: var(--accent); }
.tagline { color: var(--muted); font-size: 15px; margin-top: 8px; max-width: 32em; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-top: 44px; width: 100%; max-width: 720px; }
.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 22px 20px;
  box-shadow: var(--shadow); text-align: left; text-decoration: none; color: var(--text);
  transition: box-shadow .15s ease, transform .15s ease, border-color .15s ease;
}
.card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); border-color: var(--accent); }
.card .name { font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card .name .arrow { color: var(--accent); font-weight: 400; transition: transform .15s ease; }
.card:hover .name .arrow { transform: translateX(3px); }
.card .desc { color: var(--muted); font-size: 13px; margin-top: 8px; line-height: 1.5; }
.card .url { color: var(--accent); font-size: 11.5px; margin-top: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.card.placeholder { border-style: dashed; box-shadow: none; }
.card.placeholder:hover { transform: none; border-color: var(--border); box-shadow: none; cursor: default; }
.card.placeholder .name { color: var(--muted); }
footer { padding: 20px 24px; color: var(--muted); font-size: 11.5px; text-align: center; flex: none; }
footer a { color: var(--muted); }
</style>
</head>
<body>
<button id="theme-toggle" title="Toggle theme" aria-label="Toggle theme">&#9789;</button>
<main>
  <div class="wordmark">GasBrazil<span class="dot">.</span>com</div>
  <div class="tagline">Data tools for Brazil's natural gas market — grid balances, pipeline capacity, and trading activity, refreshed daily.</div>
  <div class="cards" id="cards"></div>
</main>
<footer>
  &copy; <span id="year"></span> GasBrazil.com &middot; Contact: <a href="mailto:eb@gasbrazil.com">eb@gasbrazil.com</a>
</footer>
<script>
// Add a future page here and it appears on the hub automatically.
const SITES = [
  {
    name: "ONS Balances Dashboard",
    url: "/ons",
    desc: "Daily grid balances, thermal generation by plant, and gas-fired dispatch across Brazil's interconnected power system.",
  },
  {
    name: "POC Results Dashboard",
    url: "/poc",
    desc: "Pipeline capacity offer results — balancing, GUS acquisition, and linepack trades across Brazil's gas transportadoras.",
  },
];

function render() {
  const el = document.getElementById("cards");
  el.innerHTML = "";
  for (const site of SITES) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = site.url;
    a.innerHTML = `<div class="name">${site.name}<span class="arrow">&rarr;</span></div><div class="desc">${site.desc}</div><div class="url">${site.url.replace(/^https?:\/\//, "").replace(/^\//, "gasbrazil.github.io/")}</div>`;
    el.appendChild(a);
  }
}
render();

document.getElementById("year").textContent = new Date().getFullYear();

function initTheme() {
  const btn = document.getElementById("theme-toggle");
  function setTheme(mode) {
    if (mode === "dark") { document.documentElement.setAttribute("data-theme", "dark"); btn.textContent = "☀"; }
    else { document.documentElement.removeAttribute("data-theme"); btn.textContent = "☽"; }
  }
  setTheme("light");
  btn.addEventListener("click", () => {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    setTheme(isDark ? "light" : "dark");
  });
}
initTheme();
</script>
</body>
</html>
