<style>
/*
 * GasBrazil.com shared design tokens + a couple of small shared components.
 *
 * Per Eric's direction (2026-09-04): the whole GasBrazil.com family shares
 * one accent -- ons-dashboard's Brazilian-flag blue -- plus explicit
 * references to the flag's green/yellow/blue everywhere, not just on the
 * ONS dashboard. A color or font change is now a one-line edit here that
 * applies to every dashboard on its next scheduled rebuild (see ADR-001,
 * Decision 2 Option C).
 *
 * The FONT_FACE placeholder below is filled in by
 * shared/dashboard_kit.py's embed_font_face() at build time with
 * @font-face rules that load ExtraLight / Light / Regular / SemiBold
 * from /shared/fonts/*.ttf (or left blank if that directory is empty).
 */
@font-face{font-family:'Pacaembu';font-weight:200;font-style:normal;font-display:swap;src:url('/shared/fonts/Pacaembu-ExtraLight.ttf') format('truetype');}@font-face{font-family:'Pacaembu';font-weight:300;font-style:normal;font-display:swap;src:url('/shared/fonts/Pacaembu-Light.ttf') format('truetype');}@font-face{font-family:'Pacaembu';font-weight:400;font-style:normal;font-display:swap;src:url('/shared/fonts/Pacaembu-Regular.ttf') format('truetype');}@font-face{font-family:'Pacaembu';font-weight:600;font-style:normal;font-display:swap;src:url('/shared/fonts/Pacaembu-SemiBold.ttf') format('truetype');}
:root {
  /* Tells the browser which palette its OWN native UI should use -- select
     dropdown popups, date pickers, scrollbars -- so those aren't stuck
     rendering light (dark text on a dark --bg, unreadable) just because we
     never told the browser the page itself went dark. */
  color-scheme: light;
  /* Cooler paper than warm cream -- closer to a desk terminal. */
  --bg: #eef0f2;
  --panel: #f7f8f9;
  --border: #d5d8dc;
  --border-strong: #b8bcc2;
  --text: #0b0b0b;
  --muted: #7a7e85;
  --muted2: #4a4e55;
  --ring: rgba(11,11,11,.10);
  --shadow: none;
  --font: "Pacaembu", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 5px;
  --radius-sm: 4px;

  /* Shared layout + density tokens (2026-09-05). Every page's .wrap uses
     these, so the site-wide content width and breathing room are a one-line
     edit here rather than four separate template edits. */
  --content-w: 80%;
  --content-max: 1280px;
  --card-pad: 10px 12px;
  --gap: 10px;

  /* Data-table body text. Was 12.5px across dashboards; dialed down for
     denser grids (POC Results especially). Pages use var(--table-font-size). */
  --table-font-size: 11px;

  /* Brazilian flag palette, shared across the whole GasBrazil.com family.
     --brz-* are the flag's own values, used for fills/borders/gradients
     where the surface behind them is dark enough. --ok-ink/--warn-ink are
     text-safe stand-ins for green/yellow at small sizes on a near-white
     background: #009C3B reads at about 3:1 here and #FFDF00 at under 2:1,
     neither legible at 11-12px, so small text and icons use the darkened
     forms while the flag values stay for solid fills/gradients. */
  --brz-green: #009C3B;
  --brz-yellow: #FFDF00;
  --brz-blue: #002776;
  --ok-ink: #00752c;
  --warn-ink: #8a6a00;

  --accent: #002776;
  --accent-soft: rgba(0,39,118,.08);
  --pos: #002776;
  --neg: #b3441e;

  /* Shared chart series palette: accent first, then muted neutrals.
     Semantic recv/del stay page-local (--flow-recv / --flow-del). */
  --chart-1: #002776;
  --chart-2: #4a5568;
  --chart-3: #2f6fed;
  --chart-4: #6b7280;
  --chart-5: #0e7490;
  --chart-6: #64748b;
  --chart-7: #1d4ed8;
  --chart-8: #475569;
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0d0d;
  --panel: #1a1a19;
  --border: #2c2c2a;
  --border-strong: #383835;
  --text: #ffffff;
  --muted: #898781;
  --muted2: #c3c2b7;
  --ring: rgba(255,255,255,.10);

  /* The flag blue itself is too dark to read as a link/button label against
     a near-black background, so dark mode lightens it while keeping the
     same hue. Yellow needs no adjustment -- it's the one flag color that
     works better on dark than on light. */

  --brz-yellow: #FFDF00;
  --brz-blue: #002776;
  --ok-ink: #22b757;
  --warn-ink: #FFDF00;

  --accent: #3f74d9;
  --accent-soft: rgba(63,116,217,.16);
  --pos: #3f74d9;
  --neg: #e08a5f;

  --chart-1: #3f74d9;
  --chart-2: #94a3b8;
  --chart-3: #60a5fa;
  --chart-4: #64748b;
  --chart-5: #22d3ee;
  --chart-6: #788396;
  --chart-7: #93c5fd;
  --chart-8: #475569;
}

/* Pacaembu is heavy at Regular -- default the whole UI to Light (300).
   Mid emphasis uses Regular (400); wordmark + page titles use SemiBold (600).
   Never Bold / 700 (that synthesizes badly and the face is already dense). */
html, body {
  margin: 0;
  font-family: var(--font);
  font-weight: 300;
  color: var(--text);
  background: var(--bg);
}
.muted, .when, .sources-label, .asof, .meta-muted { font-weight: 200; color: var(--muted); }
.wordmark, h1 { font-weight: 600; }
.emph, .navlink, .kpi-title, .card .name, .panel-title, th, b, strong {
  font-weight: 400;
}

/* Green/yellow/blue band, proportioned like the flag itself (green field,
   yellow lozenge, blue disc) rather than three equal thirds -- the one place
   the flag appears as itself rather than as an accent on something else.
   Every dashboard's header markup includes
   <div class="flagbar" aria-hidden="true"></div> right after </header>. */
.flagbar {
  height: 4px;
  border-radius: 2px;
  margin: 0 0 12px;
  background: linear-gradient(90deg,
    var(--brz-green) 0 46%, var(--brz-yellow) 46% 73%, var(--accent) 73% 100%);
}

/* Shared content column. 80% of the viewport, capped so it doesn't sprawl on
   an ultrawide monitor, and released to full width below 900px where 80%
   would waste more than it gains. */
.wrap {
  width: var(--content-w);
  max-width: var(--content-max);
  min-width: 0;
  margin: 0 auto;
  padding: 14px 0 32px;
}
@media (max-width: 900px) {
  .wrap { width: auto; padding: 14px 12px 32px; }
}

/* Sticky compact desk header: title · nav · as-of · tools. */
.site-header, header.top, header.dash-head {
  position: sticky;
  top: 0;
  z-index: 40;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  padding-top: 10px;
  margin: 0 0 0;
}
.asof-strip {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 14px;
  font-size: 11.5px; font-weight: 200; color: var(--muted);
  margin: 0 0 10px; padding: 4px 0;
  border-bottom: 1px solid var(--border);
}
.asof-strip .asof-label {
  text-transform: uppercase; letter-spacing: .06em; font-weight: 400;
  color: var(--muted2); font-size: 10.5px;
}
.asof-strip .asof-val { font-weight: 300; color: var(--muted2); font-variant-numeric: tabular-nums; }

/* Text nav (not pill clusters): underline active page. */
.navlinks, .header-links {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px;
}
.navlink {
  font-size: 12px;
  color: var(--muted2);
  text-decoration: none;
  font-weight: 400;
  border: none;
  border-bottom: 2px solid transparent;
  border-radius: 0;
  padding: 4px 0;
  white-space: nowrap;
  background: transparent;
}
.navlink:hover { color: var(--accent); border-bottom-color: var(--accent-soft); }
.navlink.is-active, .navlink[aria-current="page"] {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 400;
}

/* Inline "i" affordance. Replaces the paragraphs of explanatory copy that
   used to sit under panel titles: the explanation is still one hover or tap
   away, but the page reads as a tool rather than a tutorial.
   Markup: <button class="infodot" aria-label="About this panel"
                   data-info="...">i</button> */
.infodot {
  display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px; flex: none;
  margin-left: 6px; padding: 0;
  border: 1px solid var(--muted); border-radius: 50%;
  background: transparent; color: var(--muted2);
  font: 400 9.5px/1 var(--font); font-style: italic;
  cursor: help; vertical-align: middle; position: relative;
}
.infodot:hover, .infodot:focus-visible {
  border-color: var(--accent); color: var(--accent); outline: none;
}
/* Anchored below-left of the dot rather than centered above it: dots sit near
   the top-left of the panel they annotate, and a centered-above tooltip clips
   against the viewport there. .infodot--right flips the anchor for a dot
   placed near the right edge of the page. */
.infodot::after {
  content: attr(data-info);
  position: absolute; left: -5px; top: calc(100% + 7px);
  width: max-content; max-width: 300px;
  background: var(--panel); color: var(--text);
  border: 1px solid var(--border-strong); border-radius: var(--radius);
  padding: 7px 9px;
  font: 300 11.5px/1.5 var(--font); font-style: normal;
  text-align: left; white-space: normal;
  box-shadow: 0 6px 20px rgba(0,0,0,.16);
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .12s ease; z-index: 60;
}
.infodot--right::after { left: auto; right: -5px; }
.infodot:hover::after, .infodot:focus-visible::after {
  opacity: 1; visibility: visible;
}

/* Sortable/filterable table header cells (see shared/dashboard_kit.py's
   JS_TABLE_SORT for the click behavior): a clickable label plus a small
   inline filter box, sharing one look across every table on every
   dashboard. th.num right-aligns the filter box to match its numeric
   column; a table's own th rule should still set position/background/etc,
   just not cursor (this overrides that to auto so only .th-label, not the
   whole cell, looks clickable). */
.table-wrap thead th,
.scroll thead th,
.meter-table-wrap thead th,
.drill-card thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  background: var(--panel);
}
/* Single-line rows site-wide: overflow truncates with ellipsis instead of
   wrapping and blowing up row height (POC Contracts especially). */
.table-wrap th, .table-wrap td,
.scroll table.data th, .scroll table.data td,
.meter-table-wrap th, .meter-table-wrap td,
.drill-card th, .drill-card td,
.entlist table.data th, .entlist table.data td,
table.data th, table.data td {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.th-label { cursor: pointer; user-select: none; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.th-label:hover { color: var(--text); }
.th-filter { display: block; width: 100%; margin-top: 4px; padding: 2px 6px; font-size: 11px; font-weight: 300; background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); color: var(--text); box-sizing: border-box; cursor: text; }
th.num .th-filter { text-align: right; }

.skip-link {
  position: absolute; left: 12px; top: -40px; z-index: 80;
  background: var(--accent); color: #fff; padding: 6px 10px;
  border-radius: var(--radius-sm); font: 400 12.5px var(--font); text-decoration: none;
}
.skip-link:focus { top: 12px; }
.langBtn, #lang-toggle {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 34px; height: 34px; padding: 0 8px;
  background: var(--panel); border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); color: var(--text); cursor: pointer;
  font: 400 11.5px/1 var(--font); letter-spacing: .04em;
}
.langBtn:hover, #lang-toggle:hover { background: var(--accent-soft); }
#theme-toggle {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 34px; height: 34px; padding: 5px 9px; line-height: 0;
  background: var(--panel); border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm); color: var(--text); cursor: pointer;
}
#theme-toggle:hover { background: var(--accent-soft); }
#theme-toggle svg { width: 16px; height: 16px; display: block; flex: none; }
.chrome-tools { display: flex; align-items: center; gap: 6px; }

@media (max-width: 720px) {

  .navlink { font-size: 11.5px; }

  }

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
async function inflateGzipB64(b64) {
  if (typeof DecompressionStream !== "function") {
    throw new Error("This browser lacks DecompressionStream (needs Chrome/Edge 80+, Firefox 113+, or Safari 16.4+).");
  }
  const ds = new DecompressionStream("gzip");
  const stream = new Blob([b64ToBytes(b64)]).stream().pipeThrough(ds);
  return new TextDecoder().decode(await new Response(stream).arrayBuffer());
}
async function inflateGzipUrl(url) {
  if (typeof DecompressionStream !== "function") {
    throw new Error("This browser lacks DecompressionStream (needs Chrome/Edge 80+, Firefox 113+, or Safari 16.4+).");
  }
  const res = await fetch(url, { cache: "no-cache" });
  if (!res.ok) throw new Error("Failed to load " + url + " (" + res.status + ")");
  const ds = new DecompressionStream("gzip");
  const stream = res.body.pipeThrough(ds);
  return new TextDecoder().decode(await new Response(stream).arrayBuffer());
}

function currentLang() {
  return document.documentElement.getAttribute("data-lang") === "pt" ? "pt" : "en";
}
function t(key) {
  const pack = GB_I18N[currentLang()] || GB_I18N.en;
  return pack[key] || GB_I18N.en[key] || key;
}
function applyI18n() {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (key) el.textContent = t(key);
  });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => {
    const key = el.getAttribute("data-i18n-aria");
    if (key) el.setAttribute("aria-label", t(key));
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    const key = el.getAttribute("data-i18n-placeholder");
    if (key) el.setAttribute("placeholder", t(key));
  });
  const langBtn = document.getElementById("lang-toggle");
  if (langBtn) {
    langBtn.textContent = currentLang() === "pt" ? "EN" : "PT";
    langBtn.title = t("langSwitch");
    langBtn.setAttribute("aria-label", t("langSwitch"));
  }
}
function initLangToggle(buttonId, onChange) {
  const btn = document.getElementById(buttonId || "lang-toggle");
  applyI18n();
  if (!btn) return;
  btn.addEventListener("click", () => {
    const next = currentLang() === "pt" ? "en" : "pt";
    document.documentElement.setAttribute("data-lang", next);
    document.documentElement.setAttribute("lang", next === "pt" ? "pt-BR" : "en");
    try { localStorage.setItem(LANG_KEY, next); } catch (e) {}
    applyI18n();
    if (onChange) onChange(next);
  });
}

document.getElementById("year").textContent = new Date().getFullYear();
initThemeToggle("theme-toggle");
initLangToggle("lang-toggle");
