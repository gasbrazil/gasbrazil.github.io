name: Refresh PLD dashboard

# CCEE appends daily-average PLD to the current-year CSV in place.
# Fetch every run (including code pushes) so Actions caches cannot
# republish a stale tip over a newer scheduled build.
on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "pld/**"
      - "shared/**"
      - ".github/workflows/pld.yml"

permissions:
  contents: write

concurrency:
  group: pld-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      GASBRAZIL_LAKE_BUCKET: ${{ secrets.GASBRAZIL_LAKE_BUCKET }}
      GASBRAZIL_ARTIFACTS_BUCKET: ${{ secrets.GASBRAZIL_ARTIFACTS_BUCKET }}
      GASBRAZIL_DATA_BASE_URL: ${{ secrets.GASBRAZIL_DATA_BASE_URL }}
      GASBRAZIL_DATA_CACHE_BUST: ${{ github.run_id }}
    defaults:
      run:
        working-directory: pld
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: "pld/requirements.txt"

      - run: uv pip install -r requirements.txt -c ../shared/constraints.txt

      - name: Cache key for this month
        id: ym
        run: echo "ym=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore raw CCEE source files
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: pld/raw
          key: pld-raw-${{ steps.ym.outputs.ym }}-${{ github.run_id }}
          restore-keys: |
            pld-raw-${{ steps.ym.outputs.ym }}-
            pld-raw-

      - name: Fetch CCEE yearly CSVs
        run: python pld_pipeline.py fetch

      - name: Build tidy parquet
        run: python pld_pipeline.py build

      - name: Build the dashboard page
        run: python dashboard.py index.html

      - name: Commit refreshed dashboard
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pld/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "pld: automated refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash .github/scripts/push-with-rebase.sh
