name: Rebuild Desk

on:
  schedule:
    - cron: "50 13 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "desk/**"
      - "shared/**"
      - ".github/workflows/desk.yml"

permissions:
  contents: write

concurrency:
  group: desk-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      GASBRAZIL_LAKE_BUCKET: ${{ secrets.GASBRAZIL_LAKE_BUCKET }}
      GASBRAZIL_ARTIFACTS_BUCKET: ${{ secrets.GASBRAZIL_ARTIFACTS_BUCKET }}
      GASBRAZIL_DATA_BASE_URL: ${{ secrets.GASBRAZIL_DATA_BASE_URL }}
      GASBRAZIL_DATA_CACHE_BUST: ${{ github.run_id }}
    defaults:
      run:
        working-directory: desk
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: "desk/requirements.txt"
      - run: uv pip install --system -r requirements.txt
      - name: Build desk page
        run: python dashboard.py index.html
      - name: Publish hub teasers
        working-directory: .
        run: python shared/publish_teasers.py || true
      - name: Commit
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desk/index.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "desk: rebuild $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            echo "Push rejected -- rebasing and retrying ($i)..."
            git pull --rebase origin main
          done
