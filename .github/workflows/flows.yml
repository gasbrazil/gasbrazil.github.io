name: Refresh Pipeline Flows dashboard

# ANP publishes one file per month, typically with a lag of several weeks,
# and revises recently-published months in place. In practice ANP itself
# only refreshes every 2-4 weeks, so the schedule below pulls fresh data
# twice a month (the 8th and 20th, UTC) rather than daily -- comfortably
# ahead of ANP's own cadence without hammering their site on days nothing
# has changed. fetch_pipeline.py's own REFRESH_LAST_N_MONTHS handles not
# re-downloading the full history on a normal run (just the last few
# months, to catch revisions).
#
# A push (a code/style change to flows/** or shared/**, not a data refresh)
# still rebuilds and redeploys the dashboard immediately, but does NOT hit
# ANP's site again -- it reuses whatever raw ANP data is already cached
# from the last scheduled fetch. Only the twice-monthly schedule, or an
# on-demand "Run workflow" dispatch, actually pulls fresh data from ANP.
on:
  schedule:
    - cron: "15 12 8,20 * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "flows/**"
      - "shared/**"
      - ".github/workflows/flows.yml"

permissions:
  contents: write

# Scoped to this workflow only -- ons, poc, contratos, and flows each own a
# different subfolder and can build concurrently.
concurrency:
  group: flows-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      GASBRAZIL_LAKE_BUCKET: ${{ secrets.GASBRAZIL_LAKE_BUCKET }}
      GASBRAZIL_ARTIFACTS_BUCKET: ${{ secrets.GASBRAZIL_ARTIFACTS_BUCKET }}
      GASBRAZIL_DATA_BASE_URL: ${{ secrets.GASBRAZIL_DATA_BASE_URL }}
      GASBRAZIL_DATA_CACHE_BUST: ${{ github.run_id }}
    defaults:
      run:
        working-directory: flows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flows/requirements.txt

      - run: pip install -r requirements.txt

      # Raw ANP files are one CSV per month -- cache the whole raw/ tree
      # keyed by year-month so a normal run only re-downloads the last few
      # months (fetch always refreshes those; see REFRESH_LAST_N_MONTHS)
      # instead of re-pulling the full multi-year history every time.
      - name: Cache key for this month
        id: ym
        run: echo "ym=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore raw ANP source files
        uses: actions/cache@v4
        with:
          path: flows/raw
          key: flows-raw-${{ steps.ym.outputs.ym }}
          restore-keys: |
            flows-raw-

      # A code-only push doesn't need fresh data from ANP -- skip the
      # network fetch and rebuild from whatever raw/ the cache restored
      # (from the last scheduled run). The one exception is a cold/evicted
      # cache with nothing in it at all (e.g. this workflow's very first
      # run): fetch anyway so a push never produces an empty dashboard.
      - name: Check for cached raw data
        id: rawcheck
        run: |
          if [ -n "$(ls -A raw 2>/dev/null)" ]; then
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_data=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch new and revised monthly files
        if: github.event_name != 'push' || steps.rawcheck.outputs.has_data != 'true'
        run: python flows_pipeline.py fetch

      - name: Skip fetch (code-only push, using cached ANP data)
        if: github.event_name == 'push' && steps.rawcheck.outputs.has_data == 'true'
        run: echo "Code-only push -- rebuilding from the raw ANP data already cached from the last scheduled fetch (8th/20th), not re-fetching from ANP."

      # Health gate (zero rows, staleness, missing point codes) runs inside
      # `build` and exits non-zero on failure -- a bad build stops here
      # rather than committing a broken dashboard over a working one.
      - name: Build the tidy data stores
        run: python flows_pipeline.py build

      - name: Build the dashboard page
        run: python dashboard.py index.html

      # Legacy branch-based Pages deployment (Settings -> Pages -> Deploy
      # from a branch -> main / root), matching ons/poc/contratos so this
      # workflow's commit never races with theirs. raw/ and data/ are
      # gitignored (large, rebuildable) -- only the built page is committed.
      - name: Commit refreshed dashboard
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flows/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "flows: automated refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            echo "Push rejected (another workflow likely pushed first) -- rebasing and retrying ($i)..."
            git pull --rebase origin main
          done
