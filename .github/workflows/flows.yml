name: Refresh Pipeline Flows dashboard

# ANP publishes one file per month, typically with a lag of several weeks,
# and revises recently-published months in place. TAG/TBG/NTS Portaria 1/2003
# workbooks often land sooner for Actual/Scheduled volumes. The schedule
# below pulls fresh data twice a month (the 8th and 20th, UTC) -- ahead of
# ANP's cadence without hammering upstream sites daily. fetch refreshes the
# last few ANP months plus TSO transparency files (see flows/tso/).
#
# A push (a code/style change to flows/** or shared/**, not a data refresh)
# still rebuilds and redeploys the dashboard immediately, but does NOT hit
# ANP/TSO sites again -- it reuses whatever raw data is already cached
# from the last scheduled fetch. Only the twice-monthly schedule, or an
# on-demand "Run workflow" dispatch, actually pulls fresh upstream data.
on:
  schedule:
    - cron: "15 12 8,20 * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "flows/**"
      - "shared/**"
      - ".github/workflows/flows.yml"

permissions:
  contents: write

# Scoped to this workflow only -- ons, poc, contratos, and flows each own a
# different subfolder and can build concurrently.
concurrency:
  group: flows-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      GASBRAZIL_LAKE_BUCKET: ${{ secrets.GASBRAZIL_LAKE_BUCKET }}
      GASBRAZIL_ARTIFACTS_BUCKET: ${{ secrets.GASBRAZIL_ARTIFACTS_BUCKET }}
      GASBRAZIL_DATA_BASE_URL: ${{ secrets.GASBRAZIL_DATA_BASE_URL }}
      GASBRAZIL_DATA_CACHE_BUST: ${{ github.run_id }}
    defaults:
      run:
        working-directory: flows
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: "flows/requirements.txt"

      - run: uv pip install --system --break-system-packages -r requirements.txt -c ../shared/constraints.txt

      # Raw ANP CSVs + TSO Portaria workbooks under raw/tso/ -- cache the whole
      # raw/ tree keyed by year-month so a normal run only re-downloads recent
      # ANP months and refreshed TSO cumulative files.
      - name: Cache key for this month
        id: ym
        run: echo "ym=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore raw ANP + TSO source files
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: flows/raw
          key: flows-raw-${{ steps.ym.outputs.ym }}
          restore-keys: |
            flows-raw-

      # A code-only push doesn't need fresh upstream data -- skip the
      # network fetch and rebuild from whatever raw/ the cache restored
      # (from the last scheduled run). The one exception is a cold/evicted
      # cache with nothing in it at all (e.g. this workflow's very first
      # run): fetch anyway so a push never produces an empty dashboard.
      - name: Check for cached raw data
        id: rawcheck
        run: |
          if [ -n "$(ls -A raw 2>/dev/null)" ]; then
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_data=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch ANP + TSO sources
        if: github.event_name != 'push' || steps.rawcheck.outputs.has_data != 'true'
        run: python flows_pipeline.py fetch

      - name: Skip fetch (code-only push, using cached raw data)
        if: github.event_name == 'push' && steps.rawcheck.outputs.has_data == 'true'
        run: echo "Code-only push -- rebuilding from raw ANP/TSO data already cached from the last scheduled fetch (8th/20th), not re-fetching upstream."

      # Health gate (zero rows, staleness, missing point codes) runs inside
      # `build` and exits non-zero on failure -- a bad build stops here
      # rather than committing a broken dashboard over a working one.
      - name: Build the tidy data stores
        run: python flows_pipeline.py build

      - name: Build the dashboard page
        run: python dashboard.py index.html

      # Legacy branch-based Pages deployment (Settings -> Pages -> Deploy
      # from a branch -> main / root), matching ons/poc/contratos so this
      # workflow's commit never races with theirs. raw/ and data/ are
      # gitignored (large, rebuildable) -- only the built page is committed.
      - name: Commit refreshed dashboard
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flows/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "flows: automated refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash .github/scripts/push-with-rebase.sh
