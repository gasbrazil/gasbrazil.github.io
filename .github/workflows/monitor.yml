name: Refresh Pipeline Monitor (TAG Mago + NTS)

# TAG Mago (hourly snapshots) and NTS OnTime (near-real-time SCADA) feed the
# unified /monitor/ dashboard. One hourly job fetches both, rebuilds monitor
# once, and publishes R2 payloads — without rebuilding the home hub on cron.
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "mago/**"
      - "nts/**"
      - "monitor/**"
      - "shared/**"
      - ".github/workflows/monitor.yml"

permissions:
  contents: write

concurrency:
  group: monitor-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      GASBRAZIL_LAKE_BUCKET: ${{ secrets.GASBRAZIL_LAKE_BUCKET }}
      GASBRAZIL_ARTIFACTS_BUCKET: ${{ secrets.GASBRAZIL_ARTIFACTS_BUCKET }}
      GASBRAZIL_DATA_BASE_URL: ${{ secrets.GASBRAZIL_DATA_BASE_URL }}
      GASBRAZIL_DATA_CACHE_BUST: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: |
            mago/requirements.txt
            nts/requirements.txt

      - name: Install dependencies
        run: uv pip install -r mago/requirements.txt -c shared/constraints.txt

      - name: Cache key for this month
        id: ym
        run: echo "ym=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore Mago raw snapshots
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: mago/raw
          key: mago-raw-${{ steps.ym.outputs.ym }}
          restore-keys: |
            mago-raw-

      - name: Restore NTS raw snapshots
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: nts/raw
          key: nts-raw-${{ steps.ym.outputs.ym }}
          restore-keys: |
            nts-raw-

      - name: Fetch TAG Mago snapshots
        working-directory: mago
        run: python mago_pipeline.py fetch --days 14

      - name: Fetch NTS OnTime snapshots
        working-directory: nts
        run: python nts_pipeline.py fetch --days 7

      - name: Build pipelines and dashboards
        run: |
          python mago/mago_pipeline.py build
          python mago/dashboard.py
          python nts/nts_pipeline.py build
          python nts/dashboard.py
          python monitor/dashboard.py

      - name: Commit dashboard artifacts
        env:
          GASBRAZIL_DATA_BASE_URL: ${{ secrets.GASBRAZIL_DATA_BASE_URL }}
          GASBRAZIL_DATA_CACHE_BUST: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mago/index.html nts/index.html monitor/index.html
          git add nts/data/nts_linepack_series.parquet lake/transport/nts_linepack_series.parquet 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore(monitor): refresh TAG Mago, NTS OnTime, and Pipeline Monitor"
          git push || bash .github/scripts/push-with-rebase.sh

      - name: Refresh home hub (Mago + NTS cards)
        if: github.event_name != 'schedule'
        env:
          GASBRAZIL_DATA_BASE_URL: ${{ secrets.GASBRAZIL_DATA_BASE_URL }}
          GASBRAZIL_DATA_CACHE_BUST: ${{ github.run_id }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          GASBRAZIL_ARTIFACTS_BUCKET: ${{ secrets.GASBRAZIL_ARTIFACTS_BUCKET }}
        run: |
          uv pip install -r poc/requirements.txt -c shared/constraints.txt
          python build_home.py
          python shared/publish_teasers.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about/index.html 404.html robots.txt sitemap.xml hub/teasers.json.gz 2>/dev/null || true
          git diff --staged --quiet || git commit -m "home: refresh hub after Pipeline Monitor update"
          git push || bash .github/scripts/push-with-rebase.sh
