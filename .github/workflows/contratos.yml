name: Refresh POC Contratos dashboard

on:
  schedule:
    # Daily at 11:00 UTC (08:00 America/Sao_Paulo).
    - cron: "0 11 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "contratos/**"
      - "shared/**"
      - ".github/workflows/contratos.yml"

permissions:
  contents: write

concurrency:
  group: contratos-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contratos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contratos/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch + build data
        run: python contratos_pipeline.py all

      - name: Build dashboard
        run: python dashboard.py index.html

      - name: Commit refreshed data + dashboard
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contratos/data/contratos.parquet contratos/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "contratos: automated refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            echo "Push rejected (another workflow likely pushed first) -- rebasing and retrying ($i)..."
            git pull --rebase origin main
          done
