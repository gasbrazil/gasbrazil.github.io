name: Refresh Gas Supply dashboard

# ANP PPGN-EL and import CSVs update monthly, typically with ~2 months of
# lag. Schedule on the 18th (UTC) so a normal month has time to land before
# we pull; push to supply/** or shared/** rebuilds from cache without
# re-hitting ANP unless the raw cache is cold.
on:
  schedule:
    - cron: "40 12 18 * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "supply/**"
      - "shared/**"
      - ".github/workflows/supply.yml"

permissions:
  contents: write

concurrency:
  group: supply-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      GASBRAZIL_LAKE_BUCKET: ${{ secrets.GASBRAZIL_LAKE_BUCKET }}
      GASBRAZIL_ARTIFACTS_BUCKET: ${{ secrets.GASBRAZIL_ARTIFACTS_BUCKET }}
      GASBRAZIL_DATA_BASE_URL: ${{ secrets.GASBRAZIL_DATA_BASE_URL }}
      GASBRAZIL_DATA_CACHE_BUST: ${{ github.run_id }}
    defaults:
      run:
        working-directory: supply
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: "supply/requirements.txt"

      - run: uv pip install --system -r requirements.txt

      - name: Cache key for this month
        id: ym
        run: echo "ym=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore raw ANP source files
        uses: actions/cache@v4
        with:
          path: supply/raw
          key: supply-raw-${{ steps.ym.outputs.ym }}
          restore-keys: |
            supply-raw-

      - name: Check for cached raw data
        id: rawcheck
        run: |
          if [ -n "$(ls -A raw 2>/dev/null)" ]; then
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_data=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch ANP CSVs
        if: github.event_name != 'push' || steps.rawcheck.outputs.has_data != 'true'
        run: python supply_pipeline.py fetch

      - name: Skip fetch (code-only push, using cached ANP data)
        if: github.event_name == 'push' && steps.rawcheck.outputs.has_data == 'true'
        run: echo "Code-only push -- rebuilding from cached raw ANP data."

      - name: Build monthly parquet
        run: python supply_pipeline.py build

      - name: Build the dashboard page
        run: python dashboard.py index.html

      - name: Commit refreshed dashboard
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supply/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "supply: automated refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            echo "Push rejected (another workflow likely pushed first) -- rebasing and retrying ($i)..."
            git pull --rebase origin main
          done
