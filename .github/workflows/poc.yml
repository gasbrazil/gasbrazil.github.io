name: Refresh POC dashboard

on:
  schedule:
    # Daily at 11:00 UTC (08:00 America/Sao_Paulo). Full-history rebuild each
    # run -- the source API currently holds a few hundred records total, so
    # this is cheap. Tighten the cadence if the source updates faster than
    # daily.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "poc/**"
      - "shared/**"
      - ".github/workflows/poc.yml"

permissions:
  contents: write

concurrency:
  group: poc-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      GASBRAZIL_LAKE_BUCKET: ${{ secrets.GASBRAZIL_LAKE_BUCKET }}
      GASBRAZIL_ARTIFACTS_BUCKET: ${{ secrets.GASBRAZIL_ARTIFACTS_BUCKET }}
      GASBRAZIL_DATA_BASE_URL: ${{ secrets.GASBRAZIL_DATA_BASE_URL }}
      GASBRAZIL_DATA_CACHE_BUST: ${{ github.run_id }}
    defaults:
      run:
        working-directory: poc
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: "poc/requirements.txt"

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Fetch + build data
        run: python poc_pipeline.py all

      - name: Build dashboard
        run: python dashboard.py index.html

      - name: Commit refreshed dashboard
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poc/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "poc: automated refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            echo "Push rejected (another workflow likely pushed first) -- rebasing and retrying ($i)..."
            git pull --rebase origin main
          done
