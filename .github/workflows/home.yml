name: Rebuild home page

# Static landing page, no data pipeline -- only rebuilds when something that
# could change its rendered output actually changes: the shared kit (a
# shared/theme.css color edit should reach this page too, same as the three
# dashboards) or its own template.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "build_home.py"
      - ".github/workflows/home.yml"

permissions:
  contents: write

concurrency:
  group: home-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: "shared/constraints.txt"

      - name: Install (for hub KPI teasers)
        run: uv pip install --system -r poc/requirements.txt -c shared/constraints.txt

      - name: Build home page
        env:
          GASBRAZIL_DATA_BASE_URL: ${{ secrets.GASBRAZIL_DATA_BASE_URL }}
          GASBRAZIL_DATA_CACHE_BUST: ${{ github.run_id }}
        run: python build_home.py

      - name: Publish hub teasers
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          GASBRAZIL_ARTIFACTS_BUCKET: ${{ secrets.GASBRAZIL_ARTIFACTS_BUCKET }}
          GASBRAZIL_DATA_BASE_URL: ${{ secrets.GASBRAZIL_DATA_BASE_URL }}
          GASBRAZIL_DATA_CACHE_BUST: ${{ github.run_id }}
        run: python shared/publish_teasers.py

      - name: Commit refreshed home page
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about/index.html 404.html robots.txt sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "home: rebuild from shared theme $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash .github/scripts/push-with-rebase.sh
