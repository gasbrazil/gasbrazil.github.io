name: Rebuild wiki

# Static documentation site, no data pipeline -- only rebuilds when
# something that could change its rendered output actually changes: the
# wiki's own markdown source, the shared kit (theme, nav, i18n), or the
# builder itself.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "wiki-src/**"
      - "build_wiki.py"
      - "shared/**"
      - ".github/workflows/wiki.yml"

permissions:
  contents: write

concurrency:
  group: wiki-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install (markdown rendering)
        run: uv pip install --system markdown

      - name: Build wiki
        run: python build_wiki.py

      - name: Commit rebuilt wiki
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "wiki: rebuild $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then break; fi
            echo "Push rejected (another workflow likely pushed first) -- rebasing and retrying ($i)..."
            git pull --rebase origin main
          done
