name: Rebuild wiki

# Static documentation site, no data pipeline -- only rebuilds when
# something that could change its rendered output actually changes: the
# wiki's own markdown source, the shared kit (theme, nav, i18n), or the
# builder itself.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "wiki-src/**"
      - "build_wiki.py"
      - "shared/**"
      - ".github/workflows/wiki.yml"

permissions:
  contents: write

concurrency:
  group: wiki-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install (markdown rendering)
        run: uv pip install --system --break-system-packages -r wiki/requirements.txt -c shared/constraints.txt

      - name: Build wiki
        run: python build_wiki.py

      - name: Commit rebuilt wiki
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "wiki: rebuild $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash .github/scripts/push-with-rebase.sh
