name: Refresh ONS dashboard

# The per-plant thermal dispatch and CMO bulletins update through the day, but
# the subsystem grid-balance bulletin (Balanco de Energia nos Subsistemas) --
# the Subsystems tab's main source -- appears to post its finalized figures
# for the prior day only once daily, in the evening UTC. Two runs a day --
# one earlier for the frequently-updated sources, one later to catch the
# balance bulletin's evening post -- narrows that gap without permanently
# pinning to one guessed minute. Carried over unchanged from the standalone
# ons-dashboard repo's schedule.
on:
  schedule:
    - cron: "40 20 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "ons/**"
      - "shared/**"
      - ".github/workflows/ons.yml"

permissions:
  contents: write

# Scoped to this workflow only (not a repo-wide "pages" group) -- ons, poc,
# and contratos each own a different subfolder and can build concurrently.
# This only serializes overlapping runs of *this* workflow (e.g. a manual
# dispatch landing mid-schedule).
concurrency:
  group: ons-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      GASBRAZIL_LAKE_BUCKET: ${{ secrets.GASBRAZIL_LAKE_BUCKET }}
      GASBRAZIL_ARTIFACTS_BUCKET: ${{ secrets.GASBRAZIL_ARTIFACTS_BUCKET }}
      GASBRAZIL_DATA_BASE_URL: ${{ secrets.GASBRAZIL_DATA_BASE_URL }}
      GASBRAZIL_DATA_CACHE_BUST: ${{ github.run_id }}
    defaults:
      run:
        working-directory: ons
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: "ons/requirements.txt"

      - run: uv pip install --system -r requirements.txt -c ../shared/constraints.txt

      # Raw ONS files are cached per calendar month. Within a month the key
      # hits and nothing is re-saved; only the current month's file is
      # re-downloaded each day, since `fetch` compares Content-Length against
      # the local copy.
      - name: Cache key for this month
        id: ym
        run: echo "ym=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore ONS source files
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ons/raw
            ons/data/_cache
          key: ons-raw-${{ steps.ym.outputs.ym }}
          restore-keys: |
            ons-raw-

      - name: Check every source URL is reachable
        run: python ons_pipeline.py verify

      - name: Download new and revised files
        run: python ons_pipeline.py fetch

      - name: Aggregate to the daily store
        run: python ons_pipeline.py build

      # Refuse to publish a store that is stale or has lost data -- on
      # failure the previous deploy stays live rather than being replaced
      # with a broken one.
      - name: Health gate
        run: |
          python ons_pipeline.py health \
            --max-age-days 5 \
            --min-rows 100000 \
            --min-series 15 \
            --min-plants 50 \
            --min-reservoirs 50

      - name: Build the dashboard page
        run: python ons_pipeline.py dashboard --html index.html

      # Legacy branch-based Pages deployment (Settings -> Pages -> Deploy
      # from a branch -> main / root), not actions/deploy-pages: that API
      # publishes one artifact as the *entire* site per repo, which would
      # make this workflow's deploy race with poc's and contratos's. Three
      # independent workflows each committing straight into their own
      # subfolder is what lets `shared/**` changes flow to all three without
      # any of them stepping on each other's deploy.
      - name: Commit refreshed dashboard
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ons/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "ons: automated refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash .github/scripts/push-with-rebase.sh
